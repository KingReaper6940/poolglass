<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="pool-chart-title pool-chart-desc"><title id="pool-chart-title">Retained success study</title><desc id="pool-chart-desc">Actual generated exact-count distribution, not an application screenshot. Bars are quantized to one thousandth of a pixel; exact fractions are in the complete data tables.</desc><rect width="800" height="380" rx="12" fill="#f3f7fc"/><g fill="#243f5b" font-family="system-ui,sans-serif"><text x="30" y="37" font-size="23">Poolglass / passing retained dice</text><text x="30" y="67" font-size="14">Roll 4d8, keep 2 lowest. Each retained die passes at most 4. Event: at least 1 passing dice.</text><text x="30" y="93" font-size="13">Event probability 93.75% · exact fractions in data tables</text><line x1="58" y1="286" x2="775" y2="286" stroke="#a7bfd6"/><rect x="60.000" y="274.750" width="233.667" height="11.250" rx="2" fill="#c8d5e7"><title>0 passing: 6.25%; 1/16</title></rect><text x="178.333" y="309" text-anchor="middle" font-size="12">0</text><rect x="296.667" y="241.000" width="233.667" height="45.000" rx="2" fill="#2e7b91"><title>1 passing: 25%; 1/4</title></rect><text x="415.000" y="309" text-anchor="middle" font-size="12">1</text><rect x="533.333" y="162.250" width="233.667" height="123.750" rx="2" fill="#2e7b91"><title>2 passing: 68.75%; 11/16</title></rect><text x="651.667" y="309" text-anchor="middle" font-size="12">2</text><text x="60" y="341" font-size="13">Number of retained dice passing the face condition</text><text x="60" y="365" font-size="12">Teal bars satisfy the selected count event. Heights use a fixed 0–100% scale.</text></g></svg>
